<text x="60" y="550" class="row">stage / stall annotation</text>
<text x="60" y="585" class="sub">QK: long scoreboard 47.67% · softmax: barrier 13.53%, short scoreboard 18.36%</text>
<text x="60" y="610" class="sub">PV: wait 58.71%, math throttle 28.41% · correction: wait 51.02%, math throttle 19.91%</text>
<text x="60" y="650" class="sub">边界来自每个 warp leader 的 clock64；PC stall 仍按对应源码区间汇总。</text>
<text x="60" y="710" class="row">为什么这版有并行</text>
<text x="60" y="742" class="sub">warp 0–3 的时间戳不再被压成 thread 0 单线；同一横轴上可以看到不同 warp 的 QK/PV/softmax 边界交叠。</text>
<text x="60" y="770" class="sub">这仍是首个 CTA 的阶段边界图，不等同于 Nsight 的逐采样 warp scheduler 时间线。</text>
